[package]
name = "rust_sdb"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
bincode = { version = "2.0.1", features = ["serde"] }
clap = { version = "4.5.49", features = ["derive"] }
firestore = { version = "0.47.0", features = ["caching", "caching-memory"] }
indicatif = { version = "0.18.0", features = ["rayon"] }
rand = "0.9.2"
rayon = "1.11.0"
regex = "1.12.2"
rustls = { version = "0.23.33", features = ["ring"] }
serde = { version = "1.0.228", features = ["serde_derive", "rc"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "full", "time", "tokio-macros"] }
